<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Treichel Labs – Legal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:      #0E0E12;
      --surface: #16161C;
      --border:  #2a2a35;
      --gold:    #E8C97A;
      --text:    #F0EDE8;
      --muted:   #6B6878;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 56px 0 48px;
      text-align: center;
    }

    .wordmark {
      font-family: 'DM Serif Display', serif;
      font-size: 2.4rem;
      color: var(--gold);
      letter-spacing: 0.04em;
    }

    .tagline {
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-top: 8px;
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 72px 24px 96px;
      flex: 1;
    }

    .section-label {
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    .apps {
      display: grid;
      gap: 24px;
    }

    .app-block {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .app-header {
      padding: 20px 28px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .app-name {
      font-family: 'DM Serif Display', serif;
      font-size: 1.3rem;
      color: var(--gold);
    }

    .app-desc {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .app-links {
      display: flex;
      gap: 0;
    }

    .app-link {
      flex: 1;
      padding: 18px 28px;
      text-decoration: none;
      color: #C8C4BE;
      font-size: 0.88rem;
      border-right: 1px solid var(--border);
      transition: background 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-link:last-child { border-right: none; }

    .app-link:hover {
      background: var(--surface);
      color: var(--gold);
    }

    .app-link .icon {
      font-size: 1rem;
      opacity: 0.6;
    }

    .app-link:hover .icon { opacity: 1; }

    footer {
      text-align: center;
      padding: 28px 24px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.76rem;
      letter-spacing: 0.06em;
    }

    a.mail {
      color: var(--gold);
      text-decoration: none;
      border-bottom: 1px solid rgba(232,201,122,0.3);
    }

    a.mail:hover { border-color: var(--gold); }
  </style>
</head>
<body>

<header>
  <div class="wordmark"> Labs</div>
  <div class="tagline">App Development</div>
</header>

<main>
  <p class="section-label">Rechtliche Informationen</p>

  <div class="apps">

    <div class="app-block">
      <div class="app-header">
        <div class="app-name">Findly</div>
        <div class="app-desc">Echtzeit-Standortteilen für Paare und Gruppen</div>
      </div>
      <div class="app-links">
        <a class="app-link" href="./datenschutz_findly.html">
          <span class="icon">🔒</span> Datenschutzerklärung
        </a>
        <a class="app-link" href="./konto-loeschen_findly.html">
          <span class="icon">🗑</span> Konto löschen
        </a>
      </div>
    </div>

  </div>
</main>

<footer>
  © 2026  Labs · <a class="mail" href="mailto:treichellabs.app@gmail.com">treichellabs.app@gmail.com</a>
</footer>

</body>
</html>
